name: Build and test

on:
  push:

jobs:

  build-and-test-windows:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

    - name: Unit tests
      run: dotnet test --project ./src/Tests/Tests.csproj --no-build --filter-not-trait "Category=Database" --verbosity normal

    - name: Database tests
      env:
        MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
        MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
      run: dotnet test --project ./src/Tests/Tests.csproj --no-build --filter-trait "Category=Database" --verbosity normal
      if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip db test]') }}

  build-and-test-linux:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

    - name: Unit tests
      run: dotnet test --project ./src/Tests/Tests.csproj --no-build --filter-not-trait "Category=Database" --verbosity normal
