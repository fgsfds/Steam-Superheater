name: Fixes database tests

on:
  push:
    branches:
      - master
    paths:
      - 'db/**'
  pull_request:
    branches:
      - master
    paths:
      - 'db/**'
  workflow_dispatch:

jobs:

  test-windows:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

    - name: Test fixes database
      env:
        MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
        MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
      run: dotnet test --project ./src/Tests/Tests.csproj --no-build --filter-trait "Category=Database" --verbosity normal
